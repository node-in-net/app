
services:
  deb:
    image: debian13-builder
    working_dir: /home/builder/
    user: builder
    entrypoint: ["/home/builder/workdir/builder/build.sh", "deb"]
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/builder/workdir
    environment:
      - OUT_DIR
  apk:
    image: debian13-builder
    working_dir: /home/builder
    user: builder
    entrypoint: ["/home/builder/workdir/builder/build.sh", "apk"]
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/builder/workdir
      # The GTK stack: build-node-in-net.sh sets GTK_STACK_HOST to the release gtk-stack.lock pins.
      - type: bind
        source: ${GTK_STACK_HOST:-./GTK_STACK_HOST-is-not-set}
        target: /home/builder/android-rust-gtk4-adwaita
        read_only: true
        bind:
          create_host_path: false
    environment:
      - OUT_DIR
      - GTK_STACK=/home/builder/android-rust-gtk4-adwaita
  rpm:
    image: fedora41-builder
    working_dir: /home/builder
    user: builder
    entrypoint: ["/home/builder/workdir/builder/build.sh", "rpm"]
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/builder/workdir
    environment:
      - OUT_DIR
  zst:
    image: arch-builder
    working_dir: /home/builder
    user: builder
    entrypoint: ["/home/builder/workdir/builder/build.sh", "zst"]
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/builder/workdir
    environment:
      - OUT_DIR
  exe:
    image: msys-builder
    working_dir: /home/builder
    user: builder
    entrypoint: ["/home/builder/workdir/builder/build.sh", "exe"]
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/builder/workdir/
    environment:
      - OUT_DIR
