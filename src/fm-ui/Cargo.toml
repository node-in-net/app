[package]
name = "gtk-fm-ui"
version = "0.6.540"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
nodeinnet-p2p = { workspace = true }
client-config = { workspace = true }
chrono = "0.4"
nodeinnet-i18n = { workspace = true }
gtk-dialogs = { workspace = true }
fm-core = { workspace = true }
once_cell = "1.19"

# No librsvg in the macOS and Windows bundles, nor in the Android GTK stack.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "android"))'.dependencies]
resvg = "0.47"

[features]
default = []

[build-dependencies]
glib-build-tools = "0.20"
