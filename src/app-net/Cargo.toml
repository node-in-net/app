[package]
name = "app-net"
version = "0.5.513"
edition = "2021"
description = "Network wiring for the remake client: node runtime + router chain + auth/identity persistence + per-device provider factory. The old app's ui_event_loop.rs, refactored to the seams app-core defines (specs/19 §3, §5). GTK-free — used by the headless binary and the GTK shell alike."

[dependencies]
app-version = { workspace = true }
p2p-handlers = { workspace = true, default-features = false, features = ["feature-rdesk", "feature-fm", "feature-net", "feature-registry", "feature-sysinfo", "feature-terminal"] }
nodeinnet-p2p = { workspace = true }
app-core = { workspace = true }
client-core = { workspace = true }
client-config = { workspace = true }
# feature-fm: the client-side file-transfer reassembler (download → temp file +
# LocalP2pEvent::TransferComplete) that RemotePeerFsRpc::read_file relies on, so
# cross-pane copy is real for the GTK app too — not only the unified test graph.
p2p-node = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
# WebDAV mount lives in web-davserver (mount_resource/unmount_resource) — the
# GTK-free home shared by the dialog and the headless path. app-net only feeds
# peer responses into it (`feed_response`) from the router chain.
web-davserver = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The launcher injects the interception DLL into a suspended child (launcher.rs).
# This was compiling only by borrowing the dependency transitively; declare it so
# the feature set is ours and does not depend on who else happens to pull it in.
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
