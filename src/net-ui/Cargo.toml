[package]
name = "gtk-net-ui"
version = "0.1.286"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { workspace = true }
nodeinnet-p2p = { workspace = true }
client-config = { workspace = true }
app-core = { workspace = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
nodeinnet-i18n = { workspace = true }
gtk-dialogs = { workspace = true }

[build-dependencies]
glib-build-tools = "0.20"

[target.'cfg(windows)'.dependencies]
# Launch-log timestamps in the Windows injection path only.
chrono = "0.4"
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading"
] }
