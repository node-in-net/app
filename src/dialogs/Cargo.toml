[package]
name = "gtk-dialogs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "File and folder pickers that survive Windows"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
relm4 = { workspace = true }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
