[package]
name = "gtk-rdesk-ui"
version = "0.1.299"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Remote Desktop UI library for NodeInNet GTK application"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { workspace = true }
nodeinnet-p2p = { workspace = true }
client-config = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
nodeinnet-i18n = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux host diagnostics only: the pkexec installers run inside a private tokio
# Runtime on a worker std::thread — no runtime exists anywhere in the viewer.
node-functions = { workspace = true, features = ["screen-capture"] }
tokio = { version = "1.36", features = ["rt-multi-thread"] }

[build-dependencies]
glib-build-tools = "0.20"
