[package]
name = "gtk-sync-ui"
version = "0.1.286"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
relm4 = { workspace = true }
nodeinnet-p2p = { workspace = true }
node-functions = { workspace = true }
client-config = { workspace = true }
serde_json = "1.0"
uuid = { version = "1.8.0", features = ["v4"] }
chrono = "0.4"
nodeinnet-i18n = { workspace = true }
gtk-dialogs = { workspace = true }

[build-dependencies]
glib-build-tools = "0.20"
